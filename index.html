<!DOCTYPE html>
<html lang="en">
<head>
<!-- © 2026 Ernani Zanandrea Dalzotto (https://github.com/ezdalzotto). All rights reserved. No license is granted to copy, modify or redistribute this code. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean's Heart Save Editor</title>
<style>
  :root{--bg:#0d1b26;--panel:#13283a;--panel2:#0f2231;--line:#24435c;--text:#e6f0f6;--muted:#8fb0c4;--accent:#3cc6c0;--gold:#f0c45a;--good:#7fe0a8}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
  .topbar{position:sticky;top:0;z-index:10;background:#0a1620f2;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  .topbar-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;line-height:1.25}
  .brand h1{font-size:20px;margin:0}
  .brand .by{font-size:12px;color:var(--muted)}
  .brand .by a,footer a{color:var(--accent);text-decoration:none}
  .brand .by a:hover,footer a:hover{text-decoration:underline}
  h1{font-size:23px;margin:0 0 4px}
  h2{font-size:17px;margin:0 0 4px}
  h3{font-size:13px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  p.sub{color:var(--muted);margin:0}
  .lang{display:flex;align-items:center;gap:4px;background:var(--panel);border:2px solid var(--accent);border-radius:999px;padding:3px 3px 3px 10px;flex:none;box-shadow:0 0 0 4px #3cc6c022}
  .lang .globe{font-size:16px}
  .lang button{background:transparent;color:var(--text);border-radius:999px;padding:7px 14px;font-size:14px}
  .lang button.on{background:var(--accent);color:#06222a}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  ol{margin:0;padding-left:20px} li{margin:6px 0}
  code{background:#0a1520;padding:1px 5px;border-radius:4px;font-size:13px}
  .path{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 2px}
  .path code{font-size:14px;padding:6px 10px;border:1px solid var(--line);user-select:all}
  kbd{background:#20405a;border-radius:4px;padding:1px 6px;font:12px ui-monospace,Consolas,monospace;border-bottom:2px solid #0a1520}
  .loadhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .guide{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted);cursor:pointer}
  .drop.over{border-color:var(--accent);color:var(--text)}
  .drop b{color:var(--text)}
  button{background:var(--accent);color:#06222a;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px;font-family:inherit}
  button.sec{background:#20405a;color:var(--text)}
  button.big{background:var(--gold);color:#2a1d00;font-size:16px;padding:12px 20px}
  button.small{padding:5px 10px;font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted);font-size:13px}
  input[type=text],input[type=number],select{background:#0a1520;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:14px}
  input[type=number]{width:96px}
  .tabs{display:flex;gap:4px;margin-bottom:-1px;flex-wrap:wrap}
  .tab{background:transparent;color:var(--muted);border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;padding:9px 14px}
  .tab.on{background:var(--panel);color:var(--text);border-color:var(--line)}
  .pane{border-top-left-radius:0}
  .cheats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
  .cheat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .cheat.on{border-color:var(--good);background:#10302a}
  .cheat .ico{font-size:24px;line-height:1}
  .cheat b{display:block}
  .cheat span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .cheat .state{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
  .cheat.on .state{color:var(--good)}
  .cheat.na{opacity:.45;cursor:default}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}
  .item{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:10px}
  .item .txt{flex:1;min-width:0}
  .item b{display:block;font-size:14px}
  .item span{display:block;color:var(--muted);font-size:12px}
  .item.changed,.vrow.changed{border-color:var(--gold)}
  .item.missing{opacity:.6}
  .toggle{appearance:none;-webkit-appearance:none;width:40px;height:22px;background:#2b4a63;border-radius:11px;position:relative;cursor:pointer;flex:none;border:0;margin:0}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#cfe1ec;transition:.15s}
  .toggle:checked{background:var(--good)} .toggle:checked::after{left:21px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
  .chip{background:#1a3448;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
  .chip.on{background:var(--accent);color:#06222a;border-color:var(--accent)}
  .chip small{opacity:.7;font-weight:500}
  .rows{display:flex;flex-direction:column;gap:6px}
  .vrow{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;display:flex;align-items:center;gap:12px}
  .vrow .txt{flex:1;min-width:0}
  .vrow b{font-size:14px}
  .vrow .hint{display:block;color:var(--muted);font-size:12.5px}
  .vrow .tech{display:block;color:#5f8299;font:11px ui-monospace,Consolas,monospace;word-break:break-all}
  .vrow .ctl{flex:none;display:flex;align-items:center;gap:6px}
  .vrow .ctl input[type=text]{width:180px}
  .place{display:inline-block;background:#1d3a50;color:#bfe0f0;border-radius:5px;padding:0 6px;font-size:11.5px;margin-left:6px;vertical-align:1px}
  .yn{font-size:12px;color:var(--muted);min-width:26px;text-align:right}
  .msg{padding:9px 12px;border-radius:8px;margin-top:10px;font-size:14px}
  .msg.ok{background:#123a33;color:#9fe8cf}
  .msg.err{background:#3a1a17;color:#ffc2b8}
  .msg.warn{background:#3a3016;color:#ffe2a6}
  textarea{width:100%;height:160px;background:#0a1520;color:var(--text);border:1px solid var(--line);border-radius:6px;font:12px ui-monospace,Consolas,monospace;padding:8px}
  .hidden{display:none!important}
  .sticky{position:sticky;bottom:0;z-index:5;background:#0b1822ee;border:1px solid var(--line);border-radius:12px;padding:12px 16px;backdrop-filter:blur(4px)}
  footer{color:#5f8299;font-size:12px;text-align:center;margin-top:24px}
  details summary{cursor:pointer}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand">
    <h1>🌊 <span data-i18n="title"></span></h1>
    <span class="by"><span data-i18n="by"></span> <a href="https://github.com/ezdalzotto" target="_blank" rel="noopener">Ernani Zanandrea Dalzotto</a></span>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <span class="globe">🌐</span>
    <button data-lang="en">🇺🇸 English</button>
    <button data-lang="pt">🇧🇷 Português</button>
  </div>
</div></div>
<main>
  <p class="sub" style="margin-bottom:14px" data-i18n="subtitle"></p>

  <div class="card">
    <div class="loadhead">
      <h2 style="margin:0" data-i18n="loadTitle"></h2>
      <button class="sec" id="guideBtn" aria-expanded="false"></button>
    </div>
    <div class="guide hidden" id="guide">
      <h2 data-i18n="howTitle"></h2>
      <ol>
        <li data-i18n="step1"></li>
        <li><span data-i18n="step2"></span>
          <div class="path"><code id="savePath">%APPDATA%\OceansHeart\oceans_heart_saves</code><button class="sec small" id="copyPath" data-i18n="copyPath"></button></div>
          <div class="muted" data-i18n="step2b"></div>
        </li>
        <li data-i18n="step3"></li>
        <li data-i18n="step4"></li>
      </ol>
    </div>
    <div id="drop" class="drop" data-i18n="drop"></div>
    <input id="file" type="file" accept=".dat,.txt,text/plain" class="hidden">
    <div class="muted" style="margin-top:8px" data-i18n="dropTip"></div>
    <details style="margin-top:8px"><summary class="muted" data-i18n="pasteSummary"></summary>
      <textarea id="paste"></textarea>
      <div class="row" style="margin-top:6px"><button class="sec" id="loadPaste" data-i18n="pasteLoad"></button></div>
    </details>
    <div id="loadMsg"></div>
  </div>

  <div id="editor" class="hidden">
    <div class="tabs">
      <button class="tab on" data-tab="cheats" data-i18n="tabCheats"></button>
      <button class="tab" data-tab="status" data-i18n="tabStatus"></button>
      <button class="tab" data-tab="items" data-i18n="tabItems"></button>
      <button class="tab" data-tab="world" data-i18n="tabWorld"></button>
      <button class="tab" data-tab="quests" data-i18n="tabQuests"></button>
      <button class="tab" data-tab="adv" data-i18n="tabSearch"></button>
    </div>

    <div class="card pane" id="tab-cheats">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div><h2 data-i18n="cheatsTitle"></h2><div class="muted" data-i18n="cheatsSub"></div></div>
        <button class="big" id="godmode" data-i18n="godmode"></button>
      </div>
      <div class="cheats" id="cheats"></div>
      <div class="msg warn" style="margin-top:14px" data-i18n="cheatsNote"></div>
    </div>

    <div class="card pane hidden" id="tab-status">
      <h2 data-i18n="statusTitle"></h2>
      <div class="muted" style="margin-bottom:10px" data-i18n="statusSub"></div>
      <div class="list" id="statusList"></div>
    </div>

    <div class="card pane hidden" id="tab-items">
      <div class="row" style="justify-content:space-between">
        <h2 data-i18n="itemsTitle"></h2>
        <input type="text" id="itemSearch" data-i18n-ph="itemsSearch">
      </div>
      <div class="muted" data-i18n="itemsSub"></div>
      <div id="itemGroups"></div>
    </div>

    <div class="card pane hidden" id="tab-world">
      <div class="row" style="justify-content:space-between">
        <h2 data-i18n="worldTitle"></h2>
        <input type="text" id="worldSearch" data-i18n-ph="worldSearch">
      </div>
      <div class="muted" data-i18n="worldSub"></div>
      <div class="chips" id="worldChips"></div>
      <div class="msg warn hidden" id="worldTip"></div>
      <div id="worldList"></div>
    </div>

    <div class="card pane hidden" id="tab-quests">
      <div class="row" style="justify-content:space-between">
        <h2 data-i18n="questsTitle"></h2>
        <input type="text" id="questSearch" data-i18n-ph="questsSearch">
      </div>
      <div class="msg warn" style="margin:8px 0 0" data-i18n="questsWarn"></div>
      <div id="questList"></div>
    </div>

    <div class="card pane hidden" id="tab-adv">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h2 style="margin:0"><span data-i18n="searchTitle"></span> <span class="muted" id="count"></span></h2>
        <div class="row">
          <input type="text" id="search" data-i18n-ph="searchPh">
          <select id="catFilter"></select>
        </div>
      </div>
      <div class="muted" style="margin-bottom:8px" data-i18n="searchSub"></div>
      <div id="advList"></div>
    </div>

    <div class="sticky">
      <div class="row">
        <button id="copy" data-i18n="copySave"></button>
        <button class="sec hidden" id="download" data-i18n="downloadSave"></button>
        <button class="sec" id="reset" data-i18n="resetAll"></button>
        <span class="muted" id="changes"></span>
      </div>
      <div id="outMsg"></div>
      <details style="margin-top:8px"><summary class="muted" data-i18n="showText"></summary><textarea id="out" readonly></textarea></details>
    </div>
  </div>

  <footer>© 2026 · <span data-i18n="devBy"></span> <a href="https://github.com/ezdalzotto" target="_blank" rel="noopener">Ernani Zanandrea Dalzotto</a> · <a href="https://github.com/ezdalzotto" target="_blank" rel="noopener">github.com/ezdalzotto</a><br><span data-i18n="footer"></span></footer>
</main>

function parseLuaString(s){
  let out = '';
  for (let i = 1; i < s.length - 1; i++){
    const c = s[i];
    if (c === '\\' && i < s.length - 2){
      const n = s[++i]; const m = {n:'\n',t:'\t',r:'\r','\\':'\\','"':'"',"'":"'"};
      if (n in m) out += m[n];
      else if (/\d/.test(n)){ let d = n; while (d.length < 3 && /\d/.test(s[i+1]) && i+1 < s.length-1) d += s[++i]; out += String.fromCharCode(+d); }
      else out += n;
    } else out += c;
  }
  return out;
}
const luaQuote = s => '"' + String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'\\r') + '"';
const LINE = /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+?)\s*;?\s*$/;
function parse(text){
  const res = []; let n = 0;
  text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').split('\n').forEach(line => {
    const m = line.match(LINE);
    if (!m){ res.push({raw:line}); return; }
    const key = m[1], v = m[2]; let type, value;
    if (/^(true|false)$/.test(v)){ type = 'boolean'; value = v === 'true'; }
    else if (/^-?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(v)){ type = 'number'; value = Number(v); }
    else if (/^".*"$/.test(v) || /^'.*'$/.test(v)){ type = 'string'; value = parseLuaString(v); }
    else { res.push({raw:line}); return; }
    res.push({key, type, value, orig:value, existed:true}); n++;
  });
  while (res.length && res[res.length-1].raw === '') res.pop();
  return {res, n};
}
const isVar = e => e.raw === undefined && !(e.value === undefined && !e.existed);

function serialize(){
  return entries.filter(e => e.raw !== undefined || isVar(e)).map(e => {
    if (e.raw !== undefined) return e.raw;
    const v = e.type === 'boolean' ? (e.value ? 'true' : 'false') : e.type === 'number' ? String(e.value) : luaQuote(e.value);
    return e.key + ' = ' + v;
  }).join('\n') + '\n';
}

const get = k => { const e = find(k); return e ? e.value : undefined; };
function set(k, v){

function makeRow(e, showPlace){
  const d = describe(e.key);
  const row = document.createElement('div'); row.className = 'vrow' + (changed(e) ? ' changed' : '');
  const txt = document.createElement('div'); txt.className = 'txt';
  const b = document.createElement('b'); b.textContent = d.t; txt.appendChild(b);
  if (d.place && showPlace){ const p = document.createElement('span'); p.className = 'place'; p.textContent = '📍 ' + d.place; txt.appendChild(p); }
  if (d.h){ const h = document.createElement('span'); h.className = 'hint'; h.textContent = d.h; txt.appendChild(h); }
  const tech = document.createElement('span'); tech.className = 'tech'; tech.textContent = e.key; txt.appendChild(tech);
  const ctl = document.createElement('div'); ctl.className = 'ctl';
  const asToggle = e.type === 'boolean' || (d.bool01 && e.type === 'number' && [0,1,undefined].includes(e.orig) && [0,1].includes(e.value));
  if (asToggle){
    const yn = document.createElement('span'); yn.className = 'yn'; yn.textContent = e.value ? T('yes') : T('no');
    const tg = document.createElement('input'); tg.type = 'checkbox'; tg.className = 'toggle'; tg.checked = !!e.value;
    tg.onchange = () => { e.value = e.type === 'boolean' ? tg.checked : (tg.checked ? 1 : 0); refresh(); };
    ctl.append(yn, tg);
  } else if (e.type === 'number'){
    const inp = document.createElement('input'); inp.type = 'number'; inp.step = 'any'; inp.value = e.value;
    inp.onchange = () => { const n = Number(inp.value); if (inp.value !== '' && isFinite(n)){ e.value = n; refresh(); } };
    ctl.appendChild(inp);
  } else {
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = e.value;
    inp.onchange = () => { e.value = inp.value; refresh(); };
    ctl.appendChild(inp);
  }
  row.append(txt, ctl); return row;
}
function renderGrouped(container, list, groupOf, order, showPlace){
  container.innerHTML = '';
  if (!list.length){ const p = document.createElement('p'); p.className = 'muted'; p.textContent = T('nothing'); container.appendChild(p); return; }
  const groups = new Map();
  list.forEach(e => { const g = groupOf(e); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(e); });
  const keys = [...groups.keys()].sort((a,b) => order ? order.indexOf(a) - order.indexOf(b) : (a === '' ? 1 : b === '' ? -1 : a.localeCompare(b, lang)));
  keys.forEach(g => {
    const h = document.createElement('h3'); h.textContent = (g || T('otherPlaces')) + '  (' + groups.get(g).length + ')'; container.appendChild(h);
    const box = document.createElement('div'); box.className = 'rows'; container.appendChild(box);
    groups.get(g).sort((a,b) => describe(a.key).t.localeCompare(describe(b.key).t, lang)).forEach(e => box.appendChild(makeRow(e, showPlace)));
  });
}

$('search').addEventListener('input', renderSearch);
$('catFilter').addEventListener('change', renderSearch);
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  ['cheats','status','items','world','quests','adv'].forEach(id => $('tab-' + id).classList.toggle('hidden', id !== t.dataset.tab));
});

function refresh(){
  if (!entries.length) return;
  renderCheats(); renderStatus(); renderItems(); renderWorld(); renderQuests(); renderSearch();
  $('out').value = serialize();
  const n = vars().filter(changed).length;
  $('changes').textContent = n ? T('changes', {n}) : T('noChanges');
}

// =====================================================================
// Idioma / Language
// =====================================================================
let guideOpen = false;
function setGuide(open){
  guideOpen = open;
  $('guide').classList.toggle('hidden', !open);
  $('guideBtn').textContent = T(open ? 'guideClose' : 'guideOpen');
  $('guideBtn').setAttribute('aria-expanded', open);
}
$('guideBtn').onclick = () => setGuide(!guideOpen);
function applyLang(){
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.title = T('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = T(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = T(el.dataset.i18nPh));
  $('paste').placeholder = T('pastePh');
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  ['loadMsg','outMsg'].forEach(id => $(id).innerHTML = '');
  setGuide(guideOpen);
  refresh();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('ohse_lang', lang); } catch(_) {}
  applyLang();
});

// =====================================================================
// Carregar / Load
// =====================================================================
function showMsg(id, kind, text){ $(id).innerHTML = '<div class="msg ' + kind + '"></div>'; $(id).firstChild.textContent = text; }
function load(text, name){
  $('loadMsg').innerHTML = '';
  if (/[\x00-\x08\x0E-\x1F]/.test(text.slice(0, 2000))){ showMsg('loadMsg','err',T('errBinary')); return; }
  const {res, n} = parse(text);
  if (!n){ showMsg('loadMsg','err',T('errEmpty')); return; }
  entries = res; fileName = name || 'save1.dat';
  const looksOH = get('sword_damage') !== undefined || get('defense') !== undefined;
  showMsg('loadMsg', looksOH ? 'ok' : 'warn', T('loaded', {f:name || T('pasted'), n}) + (looksOH ? '' : T('notOH')));
  $('editor').classList.remove('hidden');
  setGuide(false);
  refresh();
}
const drop = $('drop'), fileInput = $('file');
drop.onclick = () => fileInput.click();
fileInput.onchange = () => { const f = fileInput.files[0]; if (f) readFile(f); fileInput.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) readFile(f); };
function readFile(f){ const r = new FileReader(); r.onload = () => load(String(r.result), f.name); r.readAsText(f); }
$('loadPaste').onclick = () => { const t = $('paste').value; if (t.trim()) load(t, null); };

// =====================================================================
// Exportar / Export
// =====================================================================
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(_) { return false; }
}
$('copyPath').onclick = async () => {
  const b = $('copyPath');
  if (await copyText(SAVE_DIR)){ b.textContent = T('pathCopied'); setTimeout(() => b.textContent = T('copyPath'), 1500); }
  else { const r = document.createRange(); r.selectNodeContents($('savePath')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
};
$('copy').onclick = async () => {
  if (await copyText(serialize())) showMsg('outMsg','ok',T('copied'));
  else { $('out').parentElement.open = true; $('out').focus(); $('out').select(); showMsg('outMsg','err',T('copyFail')); }
};
// Baixar só funciona fora de molduras (ex.: GitHub Pages ou arquivo local)
let framed = true; try { framed = window.self !== window.top; } catch(_) {}
if (!framed) $('download').classList.remove('hidden');
$('download').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([serialize()], {type:'text/plain'}));
  a.download = fileName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showMsg('outMsg','ok',T('downloaded'));
};
$('reset').onclick = () => {
  entries = entries.filter(e => e.raw !== undefined || e.existed);
  entries.forEach(e => { if (e.raw === undefined) e.value = e.orig; });
  refresh(); showMsg('outMsg','ok',T('resetDone'));
};

applyLang();
})();
</script>
</body>
</html>
